<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>GameHub Football</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="game-container"></div>

    <!-- Match HUD -->
    <div id="hud">

        <div class="scoreboard">
            <div class="team-name" id="home-team">GAMEHUB FC</div>

            <div class="score">
                <span id="home-score">0</span>
                <span>-</span>
                <span id="away-score">0</span>
            </div>

            <div class="team-name" id="away-team">RIVALS FC</div>

            <div class="timer" id="timer">02:00</div>
        </div>

        <div class="player-info">
            <strong id="player-name">Cristiano Ronaldo</strong>
            <span>OVR <b id="player-rating">90</b></span>

            <div class="stamina-bar">
                <div id="stamina-fill"></div>
            </div>
        </div>

    </div>

    <!-- Start screen -->
    <div id="start-screen">

        <div class="start-box">
            <div class="football-icon">⚽</div>

            <h1>GAMEHUB<br><span>FOOTBALL</span></h1>

            <p>ARCADE FOOTBALL</p>

            <button id="start-button">KICK OFF</button>

            <small>
                PC: WASD / Arrow Keys to move<br>
                SPACE: Shoot &nbsp; | &nbsp; SHIFT: Sprint
            </small>
        </div>

    </div>

    <!-- Goal message -->
    <div id="goal-message">
        <h1>GOAL!</h1>
        <p id="goal-scorer">Cristiano Ronaldo</p>
    </div>

    <!-- Mobile controls -->
    <div id="mobile-controls">

        <div id="joystick">
            <div id="joystick-stick"></div>
        </div>

        <div class="action-buttons">
            <button id="pass-button">PASS</button>
            <button id="shoot-button">SHOOT</button>
            <button id="sprint-button">SPRINT</button>
        </div>

    </div>

    <!-- Three.js -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

    <script src="game.js"></script>

</body>
</html>
